<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Voice Pet Translator</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/><style>body{font-family:'Inter',sans-serif;}</style></head><script src="config.js"></script>
<body class="bg-gray-950 text-white min-h-screen"><nav class="border-b border-gray-800 px-6 py-4 flex items-center justify-between"><div class="flex items-center gap-2"><span class="text-2xl">🐾</span><span class="font-bold text-xl">Voice Pet Translator</span></div><div class="flex gap-2"><button onclick="showTab('translate')" class="tab-btn px-3 py-2 rounded-lg text-sm bg-amber-500 text-black font-bold" data-tab="translate">Translate</button><button onclick="showTab('history')" class="tab-btn px-3 py-2 rounded-lg text-sm text-gray-400" data-tab="history">History</button></div></nav><div id="tab-translate" class="p-6 max-w-2xl mx-auto"><h1 class="text-3xl font-black mb-4 text-center">What is your pet saying? 🐶</h1><div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4"><select id="pet-type" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm"><option>Dog 🐶</option><option>Cat 🐱</option><option>Bird 🦜</option><option>Rabbit 🐰</option></select><select id="sound-type" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm"><option>Barking</option><option>Whining</option><option>Growling</option><option>Purring</option><option>Howling</option><option>Silent but restless</option></select><textarea id="situation" rows="4" placeholder="Describe the situation in detail..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm resize-none focus:outline-none focus:border-amber-500"></textarea><button onclick="translate()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-black py-3 rounded-xl text-lg">🔊 Translate Now</button></div><div id="result-box" class="hidden mt-4 bg-gray-900 border border-amber-700 rounded-2xl p-6"><p class="font-bold text-amber-400 mb-2" id="res-emotion">—</p><div id="res-translation" class="text-sm text-gray-200 italic mb-3 bg-gray-800 rounded-xl p-4"></div><div id="res-advice" class="text-sm text-gray-300"></div></div></div><div id="tab-history" class="p-6 hidden"><h1 class="text-2xl font-bold mb-4">Translation History 📝</h1><div id="history-list" class="space-y-3 max-w-2xl"></div></div><script>const SUPABASE_URL='https://nmulrsbqdeqokvrybapn.supabase.co';const SUPABASE_KEY=window.APP_CONFIG?.SUPABASE_KEY||'';const GROQ_KEY=window.APP_CONFIG?.GROQ_KEY||'';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function showTab(tab){document.querySelectorAll('[id^="tab-"]').forEach(el=>el.classList.add('hidden'));document.getElementById('tab-'+tab).classList.remove('hidden');document.querySelectorAll('.tab-btn').forEach(btn=>{btn.classList.remove('bg-amber-500','text-black','font-bold');btn.classList.add('text-gray-400');});const a=document.querySelector(`[data-tab="${tab}"]`);a.classList.add('bg-amber-500','text-black','font-bold');a.classList.remove('text-gray-400');if(tab==='history')loadHistory();}async function translate(){const petType=document.getElementById('pet-type').value,sound=document.getElementById('sound-type').value,situation=document.getElementById('situation').value;const el=document.getElementById('result-box');el.classList.remove('hidden');document.getElementById('res-emotion').textContent='Analyzing...';const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':`Bearer ${GROQ_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:`You are an animal behaviorist. Analyze this pet behavior:\nPet: ${petType}\nSound: ${sound}\nSituation: ${situation}\n\nRespond in JSON: {"emotion":"primary emotion","confidence":85,"translation":"What your pet says in 1st person (2 sentences)","advice":"2 practical owner tips"}`}],max_tokens:300})});const data=await res.json();try{const text=data.choices[0].message.content;const json=JSON.parse(text.match(/\{[\s\S]*\}/)[0]);document.getElementById('res-emotion').textContent=json.emotion+' · '+json.confidence+'% confidence';document.getElementById('res-translation').innerHTML=`"${json.translation}"`;document.getElementById('res-advice').innerHTML=`<p class="font-semibold text-amber-400 mb-1">💡 Tip:</p><p>${json.advice}</p>`;await sb.from('vpt_translations').insert([{pet_type:petType,sound,situation,emotion:json.emotion,translation:json.translation,confidence:json.confidence}]);}catch(e){document.getElementById('res-emotion').textContent='Analysis complete';document.getElementById('res-translation').textContent=data.choices[0].message.content;}}async function loadHistory(){const{data}=await sb.from('vpt_translations').select('*').order('created_at',{ascending:false}).limit(20);document.getElementById('history-list').innerHTML=(data||[]).map(t=>`<div class="bg-gray-900 border border-gray-800 rounded-xl p-4"><p class="font-medium text-amber-400">${t.emotion}</p><p class="text-sm text-gray-300 italic mt-1">"${t.translation}"</p><p class="text-xs text-gray-500 mt-1">${t.pet_type} · ${new Date(t.created_at).toLocaleDateString()}</p></div>`).join('')||'<p class="text-gray-500">No translations yet.</p>';}</script></body></html>
